<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}3B Verify{% endblock %}</title>
<!-- Para entornos aislados, descargue Bootstrap y sírvalo desde /static/. No se envían datos documentales a la CDN. -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--ink:#17212b;--muted:#5d6b7a;--paper:#f3f5f7;--card:#fff;--line:#d9dfe5;--accent:#0f6b63;--accent-dark:#0a504a;
--ok:#1b7a4b;--ok-bg:#e3f3ea;--warn:#8a5a00;--warn-bg:#fbefd0;--bad:#9b2c2c;--bad-bg:#f8e1e1;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
h1,h2,h3,h4,h5{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}a:hover{color:var(--accent-dark)}
:focus-visible{outline:3px solid #7cc4bb;outline-offset:2px}
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--ink);text-decoration:none}
.brand span{color:var(--accent)}
.topbar .nav-link{color:var(--muted);padding:.9rem .9rem;border-bottom:2px solid transparent}
.topbar .nav-link:hover{color:var(--ink)}.topbar .nav-link.active{color:var(--ink);border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px}
.panel-pad{padding:1.5rem}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn-accent:hover,.btn-accent:focus{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn-accent:disabled{background:#8fb5b1;border-color:#8fb5b1;color:#fff}
.chip{display:inline-block;padding:.12rem .6rem;border-radius:999px;font-size:.8rem;font-weight:600}
.chip-cumple,.badge-cumple{background:var(--ok-bg);color:var(--ok)}
.chip-requiere_revision,.badge-requiere_revision{background:var(--warn-bg);color:var(--warn)}
.chip-no_cumple,.badge-no_cumple{background:var(--bad-bg);color:var(--bad)}
.badge.badge-cumple,.badge.badge-requiere_revision,.badge.badge-no_cumple{font-size:.95rem;padding:.35rem .7rem}
.quote{font-family:var(--serif);background:#f7f9fa;border-left:3px solid var(--accent);padding:.5rem .8rem;border-radius:0 4px 4px 0}
.table{--bs-table-bg:transparent}.table th{color:var(--muted);font-weight:600;font-size:.85rem}
.nav-tabs .nav-link{color:var(--muted)}.nav-tabs .nav-link.active{color:var(--ink);font-weight:600;border-bottom-color:var(--card)}
.alert{border-radius:6px}
</style></head>
<body>
<header class="topbar mb-4"><div class="container d-flex align-items-center gap-4 flex-wrap">
<a class="brand py-2" href="{% url 'dashboard' %}">3B <span>Verify</span></a>
{% if user.is_authenticated %}
<nav class="nav me-auto">
<a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Inicio</a>
<a class="nav-link {% if request.resolver_match.url_name == 'list' %}active{% endif %}" href="{% url 'list' %}">Expedientes</a>
{% if user.is_tech_admin %}<a class="nav-link {% if request.resolver_match.url_name == 'config_home' %}active{% endif %}" href="{% url 'config_home' %}">Configuración</a>{% endif %}
</nav>
<form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2">{% csrf_token %}
<span class="text-muted small">{{ user.get_username }}</span><button class="btn btn-sm btn-outline-secondary">Cerrar sesión</button></form>
{% endif %}
</div></header>
<main class="container pb-5">
{% for m in messages %}<div class="alert {% if m.tags == 'error' %}alert-danger{% elif m.tags == 'warning' %}alert-warning{% elif m.tags == 'success' %}alert-success{% else %}alert-info{% endif %}" role="alert">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}</body></html>
