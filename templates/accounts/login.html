{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto;">
  <h1>Iniciar sesión</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="errors">Usuario o contraseña incorrectos.</p>{% endif %}
    <label for="id_username">Usuario</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    <label for="id_password">Contraseña</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button type="submit">Entrar</button></p>
  </form>
</div>
{% endblock %}
