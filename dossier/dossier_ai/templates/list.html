{% extends "base.html" %}{% block content %}
<h3>Expedientes</h3>
<form class="row g-2 mb-3" method="get">
<div class="col-auto"><input type="date" class="form-control" name="from" value="{{ f.from }}"></div>
<div class="col-auto"><input type="date" class="form-control" name="to" value="{{ f.to }}"></div>
<div class="col-auto"><select class="form-select" name="status"><option value="">Estado</option>{% for v,l in statuses %}<option value="{{ v }}" {% if f.status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
<div class="col-auto"><select class="form-select" name="recommendation"><option value="">Dictamen</option><option value="aprobado" {% if f.recommendation == "aprobado" %}selected{% endif %}>Aprobado</option><option value="no_aprobado" {% if f.recommendation == "no_aprobado" %}selected{% endif %}>No aprobado</option></select></div>
<div class="col-auto"><button class="btn btn-accent">Filtrar</button></div></form>
<div class="panel px-3 pt-2">{% include "_table.html" %}</div>{% endblock %}
