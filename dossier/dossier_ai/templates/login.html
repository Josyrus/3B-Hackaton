{% extends "base.html" %}{% block content %}
<div class="panel panel-pad" style="padding:2rem;box-shadow:0 20px 50px rgba(0,0,0,.25)">
<div class="d-flex align-items-center gap-3 mb-3"><span class="brand-mark" style="width:42px;height:42px;font-size:1rem">3B</span><div><h4 class="mb-0">3B Verify</h4><div class="text-muted small">Análisis de expedientes</div></div></div>
<h5 class="mb-1">Iniciar sesión</h5><p class="text-muted small">Acceso para el equipo legal.</p>
<form method="post">{% csrf_token %}
{% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
<div class="mb-3"><label class="form-label" for="id_username">Usuario</label><input class="form-control" id="id_username" name="username" autofocus required></div>
<div class="mb-3"><label class="form-label" for="id_password">Contraseña</label><input class="form-control" id="id_password" type="password" name="password" required></div>
<button class="btn btn-accent w-100 py-2">Entrar</button></form></div>{% endblock %}
