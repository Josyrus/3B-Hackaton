{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
<div class="panel panel-pad mt-4"><h4 class="mb-1">Iniciar sesión</h4><p class="text-muted small">Acceso para el equipo legal.</p>
<form method="post">{% csrf_token %}
{% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
<div class="mb-3"><label class="form-label" for="id_username">Usuario</label><input class="form-control" id="id_username" name="username" autofocus required></div>
<div class="mb-3"><label class="form-label" for="id_password">Contraseña</label><input class="form-control" id="id_password" type="password" name="password" required></div>
<button class="btn btn-accent w-100">Entrar</button></form></div></div></div>{% endblock %}
